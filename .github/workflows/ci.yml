name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardas:
    name: Guardas de repositorio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guardas (secretos, .env, migraciones, nomenclatura)
        run: bash scripts/ci/guardas.sh

  cliente:
    name: Cliente (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deno 2.9.6
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Formato
        run: deno fmt --check supabase/functions/_shared
      - name: Lint
        run: deno lint supabase/functions/_shared
      - name: Typecheck
        run: deno check supabase/functions/_shared
      - name: Pruebas
        run: deno test supabase/functions/_shared

  pgtap:
    name: pgTAP (Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Supabase CLI 3.0.0
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Inicializar configuración local
        run: supabase init
      - name: Levantar Supabase local
        run: supabase start
      - name: Aplicar migraciones en base limpia
        run: supabase db reset
      - name: Ejecutar suites pgTAP
        run: supabase test db
