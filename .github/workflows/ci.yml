name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardas:
    name: Guardas de repositorio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guardas (secretos, .env, migraciones, nomenclatura)
        run: bash scripts/ci/guardas.sh

  cliente:
    name: Cliente (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deno 2.9.6
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Formato
        run: deno fmt --check supabase/functions --ignore=supabase/functions/README.md
      - name: Lint
        run: deno lint supabase/functions
      - name: Entrypoints EF detectados
        run: |
          echo "Entrypoints EF (supabase/functions/*/index.ts):"
          find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -print | sort
      - name: Typecheck
        run: |
          deno check supabase/functions/_shared
          for entrypoint in supabase/functions/*/index.ts; do
            if [ -f "$entrypoint" ]; then
              echo "deno check $entrypoint"
              deno check "$entrypoint"
            fi
          done
      - name: Pruebas
        run: deno test supabase/functions

  pgtap:
    name: pgTAP (Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Supabase CLI 3.0.0
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Inicializar configuración local
        run: supabase init
      - name: Levantar Supabase local
        run: supabase start
      - name: Aplicar migraciones en base limpia
        run: supabase db reset
      - name: Ejecutar suites pgTAP
        run: supabase test db

  e2e:
    name: E2E Playwright
    # Playwright 1.55 no soporta Chromium en ubuntu-26.04 (ubuntu-latest desde 2026-11);
    # se fija a la imagen 24.04 (noble), soportada por `playwright install --with-deps`.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium + dependencias del sistema
        run: npx playwright install --with-deps chromium
      - name: Ejecutar suite E2E
        run: npx playwright test -c tests/e2e/playwright.config.ts
        env:
          CI: true
          E2E_CHANNEL: none
      - name: Subir artefactos (trace/screenshot/video)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7
          if-no-files-found: warn

  m1-e2e-real:
    name: E2E real M1 (Supabase local)
    # Playwright 1.55 no soporta Chromium en ubuntu 26.04; se usa la imagen 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Supabase CLI 3.0.0
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Inicializar configuración local
        run: supabase init
      - name: Levantar Supabase local
        run: supabase start
      - name: Aplicar migraciones en base limpia
        run: supabase db reset
      - name: Exportar entorno local (efímero)
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          for name in API_URL ANON_KEY JWT_SECRET DB_URL; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::Falta $name en 'supabase status -o env'"
              supabase status -o env | cut -d= -f1
              exit 1
            fi
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Instalar cliente psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Aplicar fixture sintética M1
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/e2e/fixtures/local-m1.sql
      - name: Instalar Chromium + dependencias del sistema
        run: npx playwright install --with-deps chromium
      - name: Ejecutar E2E real M1 (PostgREST + RLS)
        run: npx playwright test -c tests/e2e/playwright.config.ts tests/e2e/empresas.local.spec.ts
        env:
          CI: true
          E2E_LOCAL_SUPABASE: '1'
          E2E_SUPABASE_URL: ${{ env.API_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          E2E_SUPABASE_JWT_SECRET: ${{ env.JWT_SECRET }}
      - name: Subir artefactos (trace/screenshot/video)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-m1-real
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7
          if-no-files-found: warn

  security:
    name: Seguridad (dependencias y bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Auditoría de producción (npm audit --omit=dev)
        run: node scripts/ci/npm-audit.mjs
      - name: Build del cliente
        run: npm run build
      - name: Probar guard build-time con claves sintéticas
        run: node scripts/ci/build-guard-test.mjs
      - name: Escaneo de credenciales en el bundle (dist)
        run: node scripts/ci/dist-scan.mjs
      - name: Self-test de fixtures negativos/positivos
        run: node scripts/ci/hardening-selftest.mjs
